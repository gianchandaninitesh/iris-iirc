:root{
  --indigo:#3A138A; --indigo-2:#2A0C66; --purple:#8A229F; --red:#C8191B; --amber:#F6AA3C;
  --ink:#1D1530; --muted:#6B6380; --line:#E7E2F0; --bg:#F7F5FB; --card:#fff;
  --lav:#EFE9F8; --lav-2:#F4EFFA; --green:#1F8A5B; --lilac:#B58CE0;
  --r:18px; --shadow:0 1px 2px rgba(42,12,102,.06),0 8px 28px rgba(42,12,102,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Plus Jakarta Sans',system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;line-height:1.5}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,textarea,select{font:inherit;color:inherit}
.wrap{max-width:1120px;margin:0 auto;padding:0 24px}

/* ---------- Iris ---------- */
.iris{display:inline-block;line-height:0;flex:none}
.iris svg{display:block;overflow:visible}
.iris .pt{transform-box:fill-box;transform-origin:center}
.iris.idle .pt{animation:breathe 3.4s ease-in-out infinite;animation-delay:calc(var(--i)*.14s)}
.iris.think svg{animation:spin 2.6s linear infinite}
.iris.think .pt{animation:pulse 1.1s ease-in-out infinite;animation-delay:calc(var(--i)*.09s)}
.iris.talk .pt{animation:talk .8s ease-in-out infinite;animation-delay:calc(var(--i)*.07s)}
@keyframes breathe{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.4px)}}
@keyframes pulse{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-5px) scale(1.1)}}
@keyframes talk{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes spin{to{transform:rotate(360deg)}}
.iav{width:var(--s);height:var(--s);border-radius:50%;background:#fff;display:inline-grid;place-items:center;box-shadow:0 2px 10px rgba(42,12,102,.18),0 0 0 1px var(--line);flex:none}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:16px;height:64px}
.top img{height:40px;display:block}
.top .prod{font-weight:700;font-size:14px;color:var(--indigo);padding-left:14px;border-left:1px solid var(--line);white-space:nowrap}
.top .sp{flex:1}
.mode{display:flex;background:var(--lav);border-radius:999px;padding:3px;font-size:13px;font-weight:600}
.mode button{padding:7px 14px;border-radius:999px;color:var(--muted);white-space:nowrap}
.mode button.on{background:#fff;color:var(--indigo);box-shadow:0 1px 3px rgba(42,12,102,.12)}

/* landing */
.hero{background:radial-gradient(1200px 500px at 85% -10%,rgba(138,34,159,.55),transparent 60%),linear-gradient(135deg,var(--indigo-2),var(--indigo) 55%,#4A1A9E);color:#fff;position:relative;overflow:hidden}
.hero .wrap{padding-top:68px;padding-bottom:84px;display:grid;grid-template-columns:1.15fr .85fr;gap:48px;align-items:center}
.eyebrow{display:inline-flex;gap:8px;align-items:center;font-size:13px;font-weight:600;letter-spacing:.02em;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);padding:6px 12px;border-radius:999px}
.eyebrow i{width:8px;height:8px;border-radius:50%;background:var(--amber)}
.hero h1{font-size:50px;line-height:1.08;font-weight:800;letter-spacing:-.02em;margin:20px 0 18px}
.hero h1 em{font-style:normal;color:var(--amber)}
.hero p.lead{font-size:18px;color:rgba(255,255,255,.82);max-width:540px}
.cta{display:inline-flex;align-items:center;gap:10px;background:var(--amber);color:var(--indigo-2);font-weight:700;padding:16px 26px;border-radius:14px;font-size:16px;box-shadow:0 10px 30px rgba(246,170,60,.35);transition:transform .15s}
.cta:hover{transform:translateY(-1px)}
.hero .meta{display:flex;gap:22px;margin-top:22px;font-size:14px;color:rgba(255,255,255,.75);flex-wrap:wrap}
.hero .meta b{color:#fff}
.irisline{display:flex;gap:14px;align-items:center;margin-top:34px;padding:12px 18px 12px 12px;border-radius:999px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);max-width:560px;font-size:14.5px;color:rgba(255,255,255,.9);line-height:1.4}
.irisline b{color:#fff}
.hero-card{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-radius:22px;padding:22px;backdrop-filter:blur(6px)}
.hero-card h4{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:rgba(255,255,255,.65);margin-bottom:14px}
.qrow{display:flex;gap:12px;align-items:flex-start;padding:14px 0;border-top:1px solid rgba(255,255,255,.12)}
.qrow:first-of-type{border-top:0}
.qrow .n{flex:none;width:30px;height:30px;border-radius:10px;background:rgba(255,255,255,.14);display:grid;place-items:center;font-weight:700;font-size:13px}
.qrow b{display:block;font-size:15px}
.qrow span{font-size:13px;color:rgba(255,255,255,.7)}
.mark-bg{position:absolute;right:-120px;bottom:-140px;width:460px;opacity:.10;pointer-events:none}
.how{padding:64px 0}
.how h2{font-size:28px;font-weight:800;letter-spacing:-.01em;color:var(--indigo)}
.how p.sub{color:var(--muted);margin-top:6px}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-top:28px}
.step{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:22px}
.step .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-weight:800;color:#fff;margin-bottom:14px}
.step b{display:block;margin-bottom:4px}
.step span{font-size:14px;color:var(--muted)}
.trust{margin-top:22px;display:flex;gap:10px;align-items:center;font-size:13px;color:var(--muted);background:#fff;border:1px dashed var(--line);border-radius:14px;padding:12px 16px}

/* quiz */
.quiz{min-height:calc(100vh - 64px);display:flex;flex-direction:column}
.prog{background:#fff;border-bottom:1px solid var(--line)}
.prog .wrap{padding-top:14px;padding-bottom:14px}
.prog .lbl{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:8px;font-weight:600}
.prog .lbl b{color:var(--indigo)}
.bar{height:6px;background:var(--lav);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--indigo),var(--purple));border-radius:99px;transition:width .4s ease}
.blocks{display:flex;gap:6px;margin-top:10px}
.blocks span{flex:1;font-size:11px;font-weight:600;color:#A79FBA;text-align:center}
.blocks span.on{color:var(--purple)}
.qbody{flex:1;display:flex;align-items:flex-start;justify-content:center;padding:44px 24px 130px}
.qcard{width:100%;max-width:760px}
.qcard.anim{animation:rise .35s ease}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.qnum{font-size:13px;font-weight:700;color:var(--purple);letter-spacing:.04em;text-transform:uppercase}
.qcard h2{font-size:30px;line-height:1.25;font-weight:800;letter-spacing:-.01em;margin:10px 0 8px;color:var(--ink)}
.qcard .help{color:var(--muted);font-size:15px;margin-bottom:26px}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chips.col{flex-direction:column}
.chip{padding:14px 18px;border-radius:14px;background:#fff;border:1.5px solid var(--line);font-weight:600;font-size:15px;transition:all .15s;display:flex;align-items:center;gap:12px;text-align:left}
.chip:hover{border-color:#C9BCE3;background:var(--lav-2)}
.chip .box{width:18px;height:18px;border-radius:6px;border:1.5px solid #C9BCE3;flex:none;display:grid;place-items:center}
.chip.radio .box{border-radius:50%}
.chip.on{border-color:var(--indigo);background:var(--lav);color:var(--indigo)}
.chip.on .box{background:var(--indigo);border-color:var(--indigo)}
.chip.radio.on .box::after{content:'';width:7px;height:7px;background:#fff;border-radius:50%}
.chips.col .chip{width:100%}
textarea.ta{width:100%;min-height:130px;border:1.5px solid var(--line);border-radius:16px;padding:16px 18px;font-size:16px;background:#fff;resize:vertical;outline:none;transition:border .15s}
textarea.ta:focus{border-color:var(--indigo)}
.ex{margin-top:10px;display:flex;flex-wrap:wrap;gap:8px}
.ex button{font-size:13px;color:var(--purple);background:var(--lav-2);border-radius:99px;padding:6px 12px;font-weight:600;text-align:left}
.ai{margin-top:22px;display:flex;gap:12px;align-items:flex-start;animation:rise .35s ease}
.ai .bub{background:#fff;border:1px solid var(--line);border-radius:4px 16px 16px 16px;padding:14px 16px;box-shadow:var(--shadow);flex:1}
.ai .bub small{display:block;font-size:12px;font-weight:700;color:var(--purple);margin-bottom:4px}
.dots span{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--purple);margin-right:4px;animation:blink 1s infinite}
.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.qfoot{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.95);backdrop-filter:blur(8px);border-top:1px solid var(--line);z-index:10}
.qfoot .wrap{display:flex;gap:16px;align-items:center;height:80px;max-width:808px}
.fhint{flex:1;display:flex;gap:12px;align-items:center;font-size:13px;color:var(--muted);line-height:1.35;min-width:0}
.fhint span{display:block}
.fhint b{color:var(--purple);font-weight:700}
.btn{padding:13px 22px;border-radius:13px;font-weight:700;font-size:15px;white-space:nowrap}
.btn.pri{background:var(--indigo);color:#fff}
.btn.pri:disabled{background:#CFC7E0;cursor:not-allowed}
.btn.ghost{color:var(--muted)}
.btn.ghost:hover{color:var(--indigo)}

/* allocation */
.allocTop{display:flex;align-items:center;gap:16px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 18px;margin-bottom:14px}
.allocTop .big{display:flex;align-items:baseline;gap:8px}
.allocTop .big b{font-size:34px;font-weight:800;color:var(--indigo);line-height:1;min-width:36px}
.allocTop .big span{font-size:13px;color:var(--muted);font-weight:600}
.allocTop .note{font-size:13px;color:var(--muted);margin-left:auto;text-align:right}
.allocTop.full .big b{color:var(--green)}
.arow{display:grid;grid-template-columns:1fr auto auto;gap:18px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 18px;margin-bottom:10px}
.an b{display:block;font-size:15px}
.an span{font-size:12.5px;color:var(--muted)}
.segs{display:flex;gap:4px}
.seg{width:22px;height:30px;border-radius:6px;background:var(--lav);transition:background .15s,transform .15s}
.seg:hover{transform:translateY(-1px)}
.seg.on.c0{background:var(--purple)}.seg.on.c1{background:var(--red)}.seg.on.c2{background:var(--amber)}.seg.on.c3{background:var(--indigo)}.seg.on.c4{background:var(--lilac)}
.ctl{display:flex;align-items:center;gap:8px}
.ctl .pts{width:42px;text-align:center;font-size:17px;font-weight:800;color:var(--indigo)}
.step-b{width:32px;height:32px;border-radius:10px;border:1.5px solid var(--line);font-weight:800;font-size:18px;line-height:1;color:var(--indigo);background:#fff}
.step-b:hover{background:var(--lav)}

/* contact */
.form{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:6px}
.field input,.field select{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:13px 14px;font-size:15px;background:#fff;outline:none}
.field input:focus,.field select:focus{border-color:var(--indigo)}
.field.full{grid-column:1/-1}
.consent{grid-column:1/-1;display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--muted);background:var(--lav-2);padding:14px;border-radius:12px;cursor:pointer}
.consent input{margin-top:3px;accent-color:var(--indigo);width:16px;height:16px}

/* loading */
.load{min-height:calc(100vh - 64px);display:grid;place-items:center;text-align:center;padding:24px;background:radial-gradient(700px 400px at 50% 40%,rgba(138,34,159,.10),transparent 70%)}
.load .iris{margin:0 auto 22px}
.load h2{font-size:26px;font-weight:800;color:var(--indigo)}
.load p.who{color:var(--muted);font-size:14px;margin-top:4px}
.load ul{list-style:none;margin-top:22px;text-align:left;display:inline-block}
.load li{padding:6px 0;color:#B4ACC6;font-weight:600;font-size:15px;transition:color .3s}
.load li.done{color:var(--ink)}
.load li.done::before{content:'✓ ';color:var(--green)}
.load li.now{color:var(--purple)}

/* result */
.rhead{background:linear-gradient(135deg,var(--indigo-2),var(--indigo));color:#fff}
.rhead .wrap{padding-top:44px;padding-bottom:40px}
.rhead small.k{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--amber)}
.rhead h1{font-size:36px;font-weight:800;letter-spacing:-.01em;margin:8px 0 12px;line-height:1.15}
.rhead p{color:rgba(255,255,255,.88);max-width:860px;font-size:16px;margin-top:8px}
.rhead p q{color:#fff;font-weight:600;quotes:"“" "”"}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.pills span{font-size:13px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);padding:6px 12px;border-radius:99px}
.inote{display:flex;gap:14px;align-items:flex-start;margin-top:24px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:18px;padding:16px 18px;max-width:860px}
.inote small{display:block;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--amber);margin-bottom:2px}
.inote div{font-size:15.5px;line-height:1.5}
.sec{padding:40px 0 0}
.sec h3{font-size:20px;font-weight:800;color:var(--indigo);margin-bottom:4px}
.sec .sub{color:var(--muted);font-size:14px;margin-bottom:18px}
.ready{display:grid;grid-template-columns:200px repeat(4,1fr);gap:14px}
.rall{background:linear-gradient(135deg,var(--indigo),var(--purple));color:#fff;border-radius:var(--r);padding:18px;display:flex;flex-direction:column;justify-content:center}
.rall small{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;opacity:.8}
.rall b{font-size:38px;font-weight:800;line-height:1.05;margin-top:4px}
.rall span{font-size:14px;font-weight:700;margin-top:2px;color:var(--amber)}
.meter{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px}
.meter .k{font-size:12.5px;font-weight:700;color:var(--muted)}
.meter .v{display:flex;align-items:baseline;gap:6px;margin:4px 0 8px}
.meter .v b{font-size:26px;font-weight:800;color:var(--ink)}
.meter .v span{font-size:12.5px;font-weight:700}
.meter .t{height:8px;background:var(--lav);border-radius:99px;overflow:hidden}
.meter .t i{display:block;height:100%;border-radius:99px;transition:width .8s ease}
.lv-hi{color:var(--green)}.lv-mid{color:#B9720E}.lv-lo{color:var(--red)}
.bg-hi{background:var(--green)}.bg-mid{background:var(--amber)}.bg-lo{background:var(--red)}
.focus{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.fcard{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:20px;position:relative;overflow:hidden}
.fcard::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px}
.fcard:nth-child(1)::before{background:var(--purple)}.fcard:nth-child(2)::before{background:var(--red)}.fcard:nth-child(3)::before{background:var(--amber)}
.fcard .k{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.fcard b{display:block;font-size:17px;margin:6px 0}
.fcard p{font-size:14px;color:var(--muted)}
.tl{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.qcol{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px}
.qcol h5{font-size:14px;font-weight:800;color:var(--indigo);display:flex;justify-content:space-between;align-items:center}
.qcol h5 span{font-size:12px;color:var(--muted);font-weight:600}
.prg{border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--bg)}
.prg b{display:block;font-size:14px;line-height:1.3;margin-bottom:6px}
.prg .why{font-size:12px;color:var(--muted);margin-bottom:8px}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px}
.tag.av{background:#E3F4EC;color:var(--green)}
.tag.cu{background:#FDF0DB;color:#A8640A}
.tag.nw{background:#F2E3F6;color:var(--purple)}
.tag.pr{background:#E8E2F7;color:var(--indigo)}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin:-6px 0 16px;font-size:13px;color:var(--muted)}
.todo{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.tcard{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:18px}
.tcard .n{width:30px;height:30px;border-radius:10px;background:var(--lav);color:var(--indigo);font-weight:800;display:grid;place-items:center;margin-bottom:10px}
.tcard b{display:block;font-size:15px;margin-bottom:4px}
.tcard p{font-size:14px;color:var(--muted)}
.askbox{background:#fff;border:1px solid var(--line);border-radius:22px;padding:20px}
.askhead{display:flex;gap:12px;align-items:center;margin-bottom:14px}
.askhead b{display:block;font-size:16px}
.askhead span{font-size:13px;color:var(--muted)}
.askc{display:flex;flex-wrap:wrap;gap:8px}
.askc button{padding:10px 14px;border-radius:99px;background:var(--lav-2);border:1.5px solid transparent;color:var(--indigo);font-weight:600;font-size:14px;transition:all .15s}
.askc button:hover{background:var(--lav)}
.askc button.on{border-color:var(--indigo);background:var(--lav)}
.askout{margin-top:14px;min-height:20px}
.askout .bub{display:flex;gap:12px;align-items:flex-start;background:var(--lav-2);border-radius:4px 16px 16px 16px;padding:14px 16px;font-size:15px;line-height:1.55}
.actions{margin:40px 0 0;background:#fff;border:1px solid var(--line);border-radius:22px;padding:26px;display:flex;gap:24px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.actions h4{font-size:19px;font-weight:800;color:var(--indigo)}
.actions p{color:var(--muted);font-size:14px}
.actions .bt{display:flex;gap:10px;flex-wrap:wrap}
.btn.out{border:1.5px solid var(--line);color:var(--indigo);background:#fff}
.reads{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.read{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px}
.read small{font-size:11px;font-weight:700;color:var(--purple);text-transform:uppercase;letter-spacing:.05em}
.read b{display:block;font-size:15px;margin-top:4px;line-height:1.35}
.foot{padding:40px 0 60px;color:var(--muted);font-size:12px;text-align:center}

/* admin */
.adm{padding:28px 0 60px}
.adm h1{font-size:26px;font-weight:800;color:var(--indigo)}
.adm .sub{color:var(--muted);font-size:14px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:22px 0}
.kpi{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.kpi small{font-size:12px;font-weight:700;color:var(--muted)}
.kpi b{display:block;font-size:30px;font-weight:800;color:var(--indigo);margin-top:2px;letter-spacing:-.02em}
.kpi span{font-size:12px;color:var(--green);font-weight:600}
.grid2{display:grid;grid-template-columns:1.6fr 1fr;gap:16px}
.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px}
.panel h3{font-size:15px;font-weight:800;color:var(--ink);margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.panel h3 small{font-weight:600;color:var(--muted);font-size:12px}
.panel.warn{background:linear-gradient(135deg,#FFF8EC,#fff);border-color:#F4DDB4}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;padding:8px 8px;border-bottom:1px solid var(--line)}
td{padding:11px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.row{cursor:pointer;transition:background .12s}
tr.row:hover{background:var(--lav-2)}
tr.new{background:#FFF8EC}
td b{display:block;font-size:13.5px}
td .s{font-size:12px;color:var(--muted)}
.urg{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:12px}
.urg i{width:8px;height:8px;border-radius:50%}
.urg.h{color:var(--red)}.urg.h i{background:var(--red)}
.urg.m{color:#B9720E}.urg.m i{background:var(--amber)}
.urg.l{color:var(--muted)}.urg.l i{background:#C9C2D6}
.st{white-space:nowrap;font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px;background:var(--lav);color:var(--indigo)}
.st.newb{background:var(--amber);color:var(--indigo-2)}
.rbar{display:flex;align-items:center;gap:8px;min-width:90px}
.rbar .t{flex:1;height:6px;background:var(--lav);border-radius:99px;overflow:hidden}
.rbar .t i{display:block;height:100%;border-radius:99px}
.rbar b{display:inline;font-size:12px;font-weight:800;color:var(--indigo)}
.um{display:flex;flex-direction:column;gap:10px}
.um div{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;background:var(--lav-2);border-radius:12px;font-size:13px}
.um div b{font-weight:700}
.um div span{flex:none;font-size:12px;font-weight:800;color:var(--purple);background:#fff;border-radius:99px;padding:2px 9px}
.bars{display:flex;flex-direction:column;gap:9px;margin-top:4px}
.bars .r{display:grid;grid-template-columns:150px 1fr 30px;gap:10px;align-items:center;font-size:12.5px}
.bars .t{height:10px;background:var(--lav);border-radius:99px;overflow:hidden}
.bars .t i{display:block;height:100%;border-radius:99px}
.bars .v{font-weight:700;color:var(--indigo);text-align:right}
.gaplist{font-size:13px;line-height:1.5}
.gaplist li{margin:6px 0 6px 18px}
.drawer-bg{position:fixed;inset:0;background:rgba(29,21,48,.35);z-index:40;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(540px,100%);background:#fff;z-index:41;overflow:auto;box-shadow:-20px 0 60px rgba(29,21,48,.2);animation:slide .25s ease}
@keyframes slide{from{transform:translateX(40px);opacity:0}}
.drawer .dh{padding:22px 24px;background:linear-gradient(135deg,var(--indigo-2),var(--indigo));color:#fff;position:relative}
.drawer .dh .row{display:flex;gap:12px;align-items:center}
.drawer .dh small{color:var(--amber);font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.drawer .dh h2{font-size:22px;font-weight:800;margin-top:2px}
.drawer .dh p{font-size:13px;color:rgba(255,255,255,.8)}
.drawer .x{position:absolute;top:16px;right:16px;color:#fff;font-size:22px;width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,.12)}
.drawer .db{padding:20px 24px 40px}
.drawer h4{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--purple);margin:20px 0 8px}
.drawer h4:first-child{margin-top:0}
.drawer ul{padding-left:18px;font-size:14px}
.drawer li{margin:5px 0}
.drawer .brief{background:var(--lav-2);border-radius:14px;padding:14px;font-size:14px}
.drawer .brief q{font-weight:600;quotes:"“" "”"}
.kv{display:grid;grid-template-columns:130px 1fr;gap:6px 12px;font-size:13px}
.kv span{color:var(--muted)}
.dm{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dm .m{background:var(--bg);border-radius:12px;padding:10px 12px}
.dm .m small{font-size:11.5px;font-weight:700;color:var(--muted);display:block}
.dm .m b{font-size:20px;font-weight:800}
.wa{background:#EAF6EF;border:1px solid #CBE8D8;border-radius:14px;padding:14px;font-size:13.5px;line-height:1.55;color:#14412C;white-space:pre-wrap}
.wa-b{margin-top:10px;display:flex;gap:10px;align-items:center}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;font-weight:600;z-index:60;animation:rise .25s}
.demo-note{font-size:11px;font-weight:700;color:var(--purple);background:var(--lav);padding:3px 8px;border-radius:6px;margin-left:8px;vertical-align:middle}

@media (max-width:900px){
  .hero .wrap{grid-template-columns:1fr;padding-top:44px;padding-bottom:56px}
  .hero h1{font-size:36px}
  .steps,.focus,.reads,.todo{grid-template-columns:1fr 1fr}
  .tl{grid-template-columns:1fr 1fr}
  .ready{grid-template-columns:1fr 1fr}
  .rall{grid-column:1/-1}
  .kpis{grid-template-columns:1fr 1fr}
  .grid2{grid-template-columns:1fr}
  .top .prod{display:none}
}
@media (max-width:600px){
  .steps,.focus,.reads,.tl,.form,.todo,.ready{grid-template-columns:1fr}
  .qcard h2{font-size:24px}
  .mode button{padding:6px 10px;font-size:12px}
  .top img{height:30px}
  .hide-sm{display:none}
  .arow{grid-template-columns:1fr;gap:10px}
  .seg{width:18px}
  .fhint span{display:none}
  .allocTop .note{display:none}
  .irisline{border-radius:20px}
}

/* ---------- v3: Iris thread ---------- */
.timeleft{display:inline-flex;align-items:center;gap:6px}
.timeleft i{width:7px;height:7px;border-radius:50%;background:var(--amber)}
.thread{display:flex;flex-direction:column;gap:12px;margin-top:4px}
.msg.me{align-self:flex-end;max-width:82%;background:var(--indigo);color:#fff;border-radius:16px 16px 4px 16px;padding:12px 16px;font-size:15.5px;font-weight:500}
.msg.me.dim{background:#E4DEEF;color:var(--muted)}
.irow{display:flex;gap:12px;align-items:flex-start;max-width:92%}
.irow .bub{background:#fff;border:1px solid var(--line);border-radius:4px 16px 16px 16px;padding:13px 16px;box-shadow:var(--shadow);flex:1;font-size:15px;line-height:1.5}
.irow .bub small{display:block;font-size:11.5px;font-weight:800;color:var(--purple);margin-bottom:4px;letter-spacing:.03em;text-transform:uppercase}
.anim{animation:rise .35s ease both}
.checks{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.ck{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;padding:5px 10px;border-radius:99px;background:var(--lav-2);color:#A79FBA}
.ck b{width:16px;height:16px;border-radius:50%;display:grid;place-items:center;font-size:10px;background:#E4DEEF;color:#fff}
.ck.ok{background:#E3F4EC;color:var(--green)}.ck.ok b{background:var(--green)}
.ck.no{background:#FDECEC;color:var(--red)}.ck.no b{background:var(--red)}
.checks.live .ck{opacity:0;animation:ckin .3s ease forwards}
.checks.live .ck:nth-child(1){animation-delay:.25s}.checks.live .ck:nth-child(2){animation-delay:.55s}.checks.live .ck:nth-child(3){animation-delay:.85s}.checks.live .ck:nth-child(4){animation-delay:1.15s}
@keyframes ckin{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}
.pbadge{display:inline-block;font-size:11px;font-weight:700;color:var(--muted);background:var(--lav-2);border-radius:99px;padding:2px 8px;margin-left:6px;text-transform:none;letter-spacing:0}
.pchips{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.pchip{text-align:left;padding:11px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);font-weight:600;font-size:14.5px;transition:all .15s}
.pchip:hover{border-color:var(--indigo);background:var(--lav)}
.scale{margin-top:12px;display:flex;flex-direction:column;gap:10px}
.scale .sr{display:grid;grid-template-columns:120px 1fr;gap:10px;align-items:center}
.scale .sr span{font-size:13px;font-weight:700;color:var(--muted)}
.scale .nums{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.sc{height:36px;border-radius:9px;border:1.5px solid var(--line);background:var(--bg);font-weight:700;font-size:14px;color:var(--ink);transition:all .12s}
.sc:hover{border-color:var(--indigo)}
.sc.on{background:var(--indigo);border-color:var(--indigo);color:#fff}
.sc.on.t{background:var(--amber);border-color:var(--amber);color:var(--indigo-2)}
.sc.in{background:var(--lav)}
.okrow{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.btn.sm{padding:10px 16px;font-size:14px;border-radius:11px}
.sumq{font-weight:600;color:var(--indigo)}
.editlink{font-size:13px;color:var(--muted);text-decoration:underline;align-self:flex-end;background:none}
.pair{display:flex;flex-direction:column;gap:24px}
.pair h4{font-size:15px;font-weight:800;margin-bottom:10px;color:var(--ink)}
.pair .chips .chip{padding:12px 16px;font-size:14.5px}
.flagnote{font-size:12.5px;color:#A8640A;background:#FDF0DB;border-radius:10px;padding:8px 12px;margin-top:8px}

/* ---------- v3: one-pager ---------- */
.op{max-width:1040px;margin:0 auto;padding:0 24px}
.ophead{background:linear-gradient(135deg,var(--indigo-2),var(--indigo) 60%,#4A1A9E);color:#fff}
.ophead .op{padding-top:40px;padding-bottom:34px}
.ophead small.k{font-size:12.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--amber)}
.ophead h1{font-size:34px;font-weight:800;letter-spacing:-.01em;margin:6px 0 4px;line-height:1.15}
.ophead .meta{font-size:14px;color:rgba(255,255,255,.75)}
.heard{margin-top:22px;display:grid;grid-template-columns:1.25fr 1fr;gap:16px}
.heard .box{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-radius:18px;padding:18px}
.heard .box small{display:block;font-size:11.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:rgba(255,255,255,.6);margin-bottom:8px}
.heard ul{list-style:none;display:flex;flex-direction:column;gap:9px;font-size:15px;line-height:1.45}
.heard li{padding-left:16px;position:relative}
.heard li::before{content:'';position:absolute;left:0;top:8px;width:7px;height:7px;border-radius:50%;background:var(--amber)}
.heard q{font-weight:600;quotes:"“" "”"}
.diag{display:flex;gap:14px;align-items:flex-start}
.diag .tagbig{display:inline-block;background:var(--amber);color:var(--indigo-2);font-weight:800;font-size:18px;border-radius:10px;padding:4px 12px;margin:2px 0 8px}
.diag p{font-size:14.5px;color:rgba(255,255,255,.88)}
.diag p b{color:#fff}
.opsec{padding-top:34px}
.opsec h3{font-size:19px;font-weight:800;color:var(--indigo);margin-bottom:2px}
.opsec .sub{color:var(--muted);font-size:13.5px;margin-bottom:16px}
.charts{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.chart{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column}
.chart h5{font-size:13.5px;font-weight:800;color:var(--ink)}
.chart .cs{font-size:12px;color:var(--muted);margin-bottom:8px}
.chart .cnote{font-size:12.5px;color:var(--ink);background:var(--lav-2);border-radius:10px;padding:8px 10px;margin-top:auto}
.legend2{display:flex;flex-direction:column;gap:4px;font-size:12px;margin:6px 0 10px}
.legend2 span{display:flex;align-items:center;gap:7px}
.legend2 i{width:9px;height:9px;border-radius:3px;flex:none}
.legend2 b{margin-left:auto;color:var(--indigo)}
.gaptrack{position:relative;height:56px;margin:18px 6px 10px}
.gaptrack .ln{position:absolute;left:0;right:0;top:24px;height:8px;border-radius:9px;background:var(--lav)}
.gaptrack .fill{position:absolute;top:24px;height:8px;border-radius:9px;background:linear-gradient(90deg,var(--purple),var(--amber))}
.gaptrack .dot{position:absolute;top:14px;width:28px;height:28px;margin-left:-14px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;color:#fff;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.gaptrack .lb{position:absolute;top:-6px;font-size:11px;font-weight:700;color:var(--muted);transform:translateX(-50%);white-space:nowrap}
.gaptrack .ax{position:absolute;top:46px;font-size:10.5px;color:#A79FBA}
.loadbars{display:flex;flex-direction:column;gap:10px;margin:8px 0 12px}
.loadbars .r small{display:flex;justify-content:space-between;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:4px}
.loadbars .t{height:14px;background:var(--lav);border-radius:99px;overflow:hidden}
.loadbars .t i{display:block;height:100%;border-radius:99px}
.ins{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.inc{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:8px}
.inc .n{font-size:12px;font-weight:800;color:var(--purple);letter-spacing:.05em;text-transform:uppercase}
.inc b{font-size:16px;line-height:1.35}
.inc p{font-size:14px;color:var(--muted)}
.inc .why{margin-top:auto;font-size:12.5px;color:var(--indigo);background:var(--lav-2);border-radius:10px;padding:8px 10px}
.two{display:grid;grid-template-columns:1.3fr 1fr;gap:14px}
.acts{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px}
.acts ol{list-style:none;counter-reset:a;display:flex;flex-direction:column;gap:12px}
.acts li{counter-increment:a;display:grid;grid-template-columns:30px 1fr;gap:10px;font-size:14px}
.acts li::before{content:counter(a);width:28px;height:28px;border-radius:9px;background:var(--lav);color:var(--indigo);font-weight:800;display:grid;place-items:center}
.acts li b{display:block;font-size:14.5px}
.acts li span{color:var(--muted)}
.assm{background:#FFFBF3;border:1px dashed #EBC98A;border-radius:18px;padding:18px}
.assm h5{font-size:14px;font-weight:800;color:#8A5208;margin-bottom:8px}
.assm ul{padding-left:18px;font-size:13.5px;color:#6D4A12;display:flex;flex-direction:column;gap:6px}
.divider{margin:44px 0 0;display:flex;align-items:center;gap:14px;color:var(--muted);font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--line)}
.progs{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.pc{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;transition:border .15s,box-shadow .15s}
.pc.sel{border-color:var(--indigo);box-shadow:0 0 0 2px var(--indigo)}
.pc svg{display:block;width:100%;height:auto}
.pc .pb{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.pc .pb b{font-size:15px;line-height:1.3}
.pc .pb p{font-size:13px;color:var(--muted)}
.pc .pm{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:2px}
.pc .pm span.d{font-size:11.5px;font-weight:700;color:var(--muted)}
.pc .fit{font-size:12.5px;color:var(--indigo);background:var(--lav-2);border-radius:9px;padding:7px 9px}
.pick{margin-top:auto;display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:700;color:var(--indigo);padding-top:6px;cursor:pointer}
.pick .bx{width:20px;height:20px;border-radius:6px;border:1.5px solid #C9BCE3;display:grid;place-items:center;color:#fff;font-size:12px}
.pc.sel .pick .bx{background:var(--indigo);border-color:var(--indigo)}
.pc.idea{border-style:dashed;background:var(--lav-2)}
.qstrip{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}
.qstrip div{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px;font-size:12.5px}
.qstrip div b{display:block;font-size:12px;color:var(--purple);margin-bottom:4px}
.sendbar{position:sticky;bottom:16px;z-index:15;margin-top:26px;background:var(--ink);color:#fff;border-radius:18px;padding:14px 16px 14px 20px;display:flex;align-items:center;gap:14px;box-shadow:0 18px 40px rgba(29,21,48,.3)}
.sendbar .t{flex:1;font-size:14px}
.sendbar .t b{color:var(--amber)}
.sendbar .btn.pri{background:var(--amber);color:var(--indigo-2)}
.sendbar .btn.out{background:transparent;color:#fff;border-color:rgba(255,255,255,.3)}
.clar{display:inline-flex;align-items:center;gap:8px;margin-top:10px;font-size:13px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:99px;padding:5px 12px}
.clar b{color:var(--amber)}
@media (max-width:900px){.charts,.ins,.progs{grid-template-columns:1fr 1fr}.heard,.two{grid-template-columns:1fr}}
@media (max-width:600px){.charts,.ins,.progs,.qstrip{grid-template-columns:1fr}.scale .sr{grid-template-columns:1fr}.sendbar{flex-wrap:wrap}.ophead h1{font-size:26px}}
</style>
</head>

function minutesLeft(){
  let m=0; QUESTIONS.forEach((q,i)=>{ if(i<S.qi) return; const t=S.th[q.id]; if(q.type==="open") m += (t&&t.status==="done")?0:1.2; else if(i>S.qi||!answered(q)) m += q.type==="alloc"?1:q.type==="pair"?.5:.3; });

  return Math.max(1, Math.round(m));
}
function answered(q){ if(q.type==="alloc") return sum(S.a.alloc)===10; if(q.type==="pair") return q.parts.every(p=>S.a[p.id]); if(q.type==="open") return S.th[q.id]?.status==="done"; return !!S.a[q.id]; }
function hintFor(q){
  if (q.id==="alloc"){
    const u=S.a.alloc, rem=10-sum(u), mx=Math.max(...Object.values(u));
    if (rem===0 && mx<=2) return "Pembagian Anda rata sekali. Kalau harus memilih satu yang paling mendesak, yang mana? Geser blok ke sana.";

  }
  if (q.type==="open"){ const t=S.th[q.id]; if(t&&t.status==="probe") return `Pertanyaan lanjutan sesi ini: <b>${S.probeCount} dari maks. ${GUARD.maxPerSession}</b>.`; }
  return esc(q.hint||"");
}

function setAlloc(i,n){ const k=AK[i], u=S.a.alloc, cur=u[k], room=10-sum(u)+cur; let t=(n===cur)?n-1:n; t=Math.max(0,Math.min(t,room)); u[k]=t; vQuiz(); }
function stepAlloc(i,d){ const k=AK[i], u=S.a.alloc; const t=u[k]+d; if(t<0||(d>0&&sum(u)>=10)) return; u[k]=t; vQuiz(); }

/* ---------- PERTANYAAN TERBUKA + IRIS ---------- */
function th(id){ return S.th[id] || (S.th[id] = { status:"idle", draft:"", answer:"", log:[], probes:[], retries:0, flags:[], data:{}, n:0, checks:null, finalChecks:null }); }
function eid(t){ return "e"+(++t.n)+"_"+Math.random().toString(36).slice(2,6); }
function say(t, html, extra={}){ t.log.push({ id:eid(t), who:"iris", html, ...extra }); }
function me(t, text, dim=false){ t.log.push({ id:eid(t), who:"me", text, dim }); }
function checksHTML(cs, live){ return `<div class="checks ${live?'live':''}">${cs.map(c=>`<span class="ck ${c.ok?'ok':'no'}"><b>${c.ok?'✓':'!'}</b>${c.label}</span>`).join("")}</div>`; }

function refreshNext(){ const q=QUESTIONS[S.qi]; const b=document.getElementById("next"); if(b&&q.type==="open"){ const t=th(q.id); if(t.status==="idle"||t.status==="retry") b.disabled=!(t.draft||"").trim(); } }

function isJunk(s){
  const x = s.trim().toLowerCase().replace(/[.!?]+$/,"");
  const w = x.split(/\s+/).filter(Boolean);

}
function topicOf(text){
  for (const k of [D,K,S_,P_,B]) if (KWA[k].test(text)) return k;
  const st=STORIES[S.a.story]; if (st) return st[0];
  return AK.reduce((m,x)=>(S.a.alloc[x]||0)>(S.a.alloc[m]||0)?x:m, AK[0]);

function topArea(){ const u=S.a.alloc; return sum(u) ? AK.reduce((m,x)=>u[x]>u[m]?x:m,AK[0]) : topicOf(""); }
function evaluate(qid, text){
  const x = text.toLowerCase(), w = x.split(/\s+/).filter(Boolean).length, vg = x.match(RX.vague);
  if (qid==="decision") return [
    { k:"spec", label:"Spesifik", ok:!vg && w>=5 }, { k:"who", label:"Siapa", ok:RX.who.test(x) },
    { k:"measure", label:"Terukur", ok:RX.measure.test(x) }, { k:"time", label:"Ada waktu", ok:RX.time.test(x) } ];
  if (qid==="success") return [
    { k:"spec", label:"Spesifik", ok:!vg && w>=5 }, { k:"measure", label:"Terukur", ok:RX.measure.test(x) },

    { k:"spec", label:"Bisa ditindaklanjuti", ok:w>=6 } ];
}

/* Memilih SATU pertanyaan lanjutan yang paling bernilai, atau null bila sudah cukup jelas. */
function plan(qid, t){
  const cs = t.finalChecks||t.checks||[], ok = k => (cs.find(c=>c.k===k)||{ok:true}).ok;
  const topic = topicOf(t.answer), vg = (t.answer.match(RX.vague)||[])[0];
  if (qid==="decision"){
    if (!ok("spec") && vg && !asked(t,"define")) { const d=DEFINE[topic];
      return { type:"define", kind:"chips", lead:`Arahnya saya tangkap. Tapi kata “${esc(vg)}” bisa berarti banyak hal.`, q:`Untuk ${d.noun}, yang paling Anda maksud yang mana?`, opts:d.opts, fills:["spec"] }; }
    if (asked(t,"define") && !asked(t,"scale") && !ok("measure"))
      return { type:"scale", kind:"scale2", lead:"Supaya bisa diukur:", q:"Dari 1 sampai 10, di mana posisi mereka sekarang, dan di angka berapa harus berada di akhir 2027?", help:"Perkiraan Anda sudah cukup. Tidak perlu presisi.", val:{}, fills:["measure","time"] };
    if (!ok("who") && !asked(t,"who"))
      return { type:"who", kind:"chips", lead:"Saya belum tahu siapa yang paling harus berubah.", q:"Kelompok mana yang paling menentukan berhasil atau tidaknya perubahan ini?", opts:[...GROUPS,"Tim HR / L&D"], fills:["who"] };
    if (!ok("measure") && !asked(t,"signal"))
      return { type:"signal", kind:"chips", lead:"Arahnya jelas, tapi belum ada tanda kapan disebut berhasil.", q:"Kalau ini berhasil, tanda apa yang paling pertama Anda lihat?", opts:[...SIGNAL[topic],"Belum tahu, ini yang ingin saya cari tahu"], fills:["measure"] };
    return null;
  }
  if (qid==="success"){
    const ta = topArea();
    if (!ok("measure") && !asked(t,"metric"))
      return { type:"metric", kind:"chips", lead: vg?`“${esc(vg)}” itu tujuan yang baik, tapi sulit dibuktikan di laporan direksi.`:"Ini belum punya ukuran yang bisa dicek.", q:"Angka apa yang paling mungkin Anda pakai untuk membuktikannya?", opts:[...SIGNAL[ta],"Belum ada angka, saya perlu dibantu menentukannya"], fills:["measure","spec","biz"] };
    if (!ok("time") && !asked(t,"when"))
      return { type:"when", kind:"chips", lead:"Satu lagi, supaya bisa dijadwalkan.", q:"Kapan perubahan pertama harus sudah terlihat?", opts:["Kuartal 1","Kuartal 2","Semester 2"], fills:["time"] };
    return null;
  }
  if (qid==="blocker"){
    if (!ok("cause") && !asked(t,"diag"))
      return { type:"diag", kind:"chips", lead:"Saya ingin memastikan penyebabnya, karena ini menentukan formatnya.", q:"Biasanya, perubahannya berhenti di titik mana?", opts:DIAG_OPT.map(x=>x[0]), fills:["cause","spec"] };
    if (!ok("who") && !asked(t,"owner"))
      return { type:"owner", kind:"chips", lead:"Terakhir.", q:"Setelah kelas selesai, siapa yang bisa memastikan praktiknya berjalan?", opts:["Atasan langsung","Tim HR / L&D","Mentor internal","Belum ada yang bertanggung jawab"], fills:["who"] };
    return null;
  }
  return null;
}
function observe(qid, cs){
  const miss = cs.filter(c=>!c.ok).map(c=>c.label.toLowerCase());
  if (!miss.length) return "Jawaban ini sudah jelas. Tidak perlu saya tanyakan lagi.";
  return `Belum ${miss.length>1?miss.slice(0,-1).join(", ")+" dan "+miss.slice(-1):miss[0]}.`;
}
async function sendOpen(){
  const q = QUESTIONS[S.qi], t = th(q.id), txt = (t.draft||"").trim();
  if (!txt || !(t.status==="idle"||t.status==="retry")) return;
  me(t, txt); t.draft = ""; t.status = "thinking"; t.showChecks = false; vQuiz();
  await sleep(500);
  if (isJunk(txt)){
    await sleep(500);
    if (t.retries < GUARD.junkRetries){
      t.retries++; t.status = "retry";
      say(t, `Hmm, sepertinya ini belum jawaban yang sebenarnya. Satu kalimat saja cukup: <b>apa yang harus berubah, dan untuk siapa</b>.<div style="font-size:13px;color:var(--muted);margin-top:6px">${esc(q.ph)}</div>`);
      vQuiz(); return;
    }
    t.answer = txt; t.flags.push("Jawaban ini belum jelas, jadi saya lewati."); t.finalChecks = evaluate(q.id,"").map(c=>({...c,ok:false}));
    t.summary = "Bagian ini kita lewati dulu. Insight Anda tetap disusun dari jawaban lain.";
    t.status = "confirm"; vQuiz(); return;
  }
  t.answer = txt;
  t.checks = evaluate(q.id, txt); t.showChecks = true; vQuiz();            // panel cek muncul satu per satu
  await sleep(GUARD.thinkMs);
  say(t, observe(q.id, t.checks), { checks:t.checks });
  t.finalChecks = t.checks.map(c=>({...c}));
  const dg = t.checks.find(c=>c.diag); if (dg) t.data.diag = dg.diag;
  step(q, t);
}
function step(q, t){
  if (S.probeCount >= GUARD.maxPerSession && plan(q.id,t)){
    say(t, "Saya sudah memakai jatah pertanyaan lanjutan untuk sesi ini, jadi sisanya saya catat sebagai asumsi.");
    t.flags.push(flagFor(q.id, t)); return finish(q, t);
  }
  if (t.probes.length >= GUARD.maxPerQuestion){ const f=flagFor(q.id,t); if(f && plan(q.id,t)) t.flags.push(f); return finish(q,t); }
  const p = plan(q.id, t);
  if (!p) return finish(q, t);
  p.id = eid(t); t.probes.push(p); S.probeCount++; t.status = "probe"; vQuiz();
}
function flagFor(qid, t){
  const fc = t.finalChecks||[];
  const miss = fc.filter(c=>!c.ok).map(c=>c.k);
  if (qid==="decision" && miss.includes("measure")) return `Ukuran keberhasilan belum disebut. Sementara saya pakai ${INDICATOR[topArea()]}.`;
  if (qid==="success" && miss.includes("time")) return "Waktu belum disebut. Saya asumsikan hasil pertama di semester 2.";
  if (qid==="blocker" && miss.includes("cause")) return "Penyebab belum dipastikan. Saya asumsikan peserta paham tapi tidak mempraktikkan.";
  return miss.length ? "Sebagian jawaban masih umum dan belum diperjelas." : "";
}
async function answerProbe(i){
  const q = QUESTIONS[S.qi], t = th(q.id), p = t.probes[t.probes.length-1];
  if (t.status!=="probe") return;
  p.ans = p.opts[i]; recordProbe(q, t, p, i);
  me(t, p.ans); t.status = "thinking"; t.showChecks = false; vQuiz();
  await sleep(900); react(q, t, p); step(q, t);
}
function scalePick(r,v){ const t=th(QUESTIONS[S.qi].id), p=t.probes[t.probes.length-1]; p.val[r]=v; vQuiz(); }
async function scaleOk(){
  const q = QUESTIONS[S.qi], t = th(q.id), p = t.probes[t.probes.length-1];
  if (!p.val.now || !p.val.target) return;
  p.ans = `Sekarang ${p.val.now}, akhir 2027 ${p.val.target}`; t.data.now = p.val.now; t.data.target = p.val.target;
  (p.fills||[]).forEach(f=>{ const c=t.finalChecks.find(c=>c.k===f); if(c) c.ok=true; });
  me(t, p.ans); t.status = "thinking"; t.showChecks = false; vQuiz();
  await sleep(900); react(q, t, p); step(q, t);
}
function recordProbe(q, t, p, i){
  const v = p.opts[i], unsure = /belum (tahu|ada)/i.test(v);
  if (!unsure) (p.fills||[]).forEach(f=>{ const c=t.finalChecks.find(c=>c.k===f); if(c) c.ok=true; });
  ({ define:()=>t.data.define=v, who:()=>t.data.who=v, signal:()=>t.data.signal=unsure?null:v, metric:()=>t.data.metric=unsure?null:v,
     when:()=>{ t.data.when=v; if(!S.a.timing) S.a.timing=v; }, diag:()=>t.data.diag=DIAG_OPT[i][1], owner:()=>t.data.owner=v })[p.type]?.();
  if (unsure) t.flags.push(p.type==="metric"||p.type==="signal" ? `Ukuran belum ditentukan. Saya usulkan memakai ${INDICATOR[topArea()]}.` : "");
}
function react(q, t, p){
  let r = "";
  if (p.type==="scale"){ const g=t.data.target-t.data.now;
    r = g>=4 ? `Dari ${t.data.now} ke ${t.data.target}: lompatan ${g} poin dalam setahun. Ambisius, dan itu biasanya butuh praktik di luar kelas, bukan hanya pelatihan.` : g>=2 ? `Dari ${t.data.now} ke ${t.data.target}: naik ${g} poin. Target yang realistis untuk satu tahun.` : g>=0 ? `Selisihnya hanya ${g} poin. Mungkin bisa dicapai lebih cepat dari akhir 2027.` : `Target lebih rendah dari posisi sekarang. Saya catat apa adanya.`; }
  else if (p.type==="define") r = `Jelas. Jadi fokusnya: ${low(p.ans)}.`;
  else if (p.type==="diag") r = `Itu berarti kebutuhannya soal <b>${DIAG[t.data.diag].k.toLowerCase()}</b>, bukan sekadar menambah kelas.`;
  else if (p.type==="metric" && t.data.metric) r = "Bagus. Ini angka yang bisa dibawa ke direksi.";
  if (r) say(t, r);
}
function finish(q, t){ t.summary = summarize(q.id, t); t.status = "confirm"; vQuiz(); }
function summarize(qid, t){
  const d = t.data;
  if (qid==="decision"){
    const who = d.who || (RX.who.test(t.answer) ? null : null);
    let s = d.define ? `${who?who+": ":""}${low(d.define)}` : `<q>${esc(trimDot(t.answer))}</q>`;
    if (d.now) s += `. Posisi sekarang ${d.now}/10, target ${d.target}/10 di akhir 2027.`;
    else if (d.signal) s += `. Tanda berhasil: ${lowFirst(d.signal)}.`;
    else s += ".";
    return s.charAt(0).toUpperCase()+s.slice(1);
  }
  if (qid==="success"){
    const m = d.metric ? lowFirst(d.metric) : null;
    if (m) return `Ukuran berhasil Anda: ${m}${d.when?`, mulai terlihat di ${low(d.when)}`:""}.`;
    return `<q>${esc(trimDot(t.answer))}</q>${d.when?` · mulai terlihat di ${low(d.when)}`:""}.`;
  }
  const dg = DIAG[d.diag || "behavior"];
  return `Program berhenti karena masalah ${dg.k.toLowerCase()}. Format yang tepat: <b>${dg.fmt.toLowerCase()}</b>${d.owner?`, dengan ${lowFirst(d.owner)} sebagai penanggung jawab praktik`:""}.`;
}
function confirmOpen(){ const q=QUESTIONS[S.qi], t=th(q.id); if(t.status!=="confirm") return; t.status="done"; next(); }

/* ---------- PERHITUNGAN INSIGHT ---------- */
const CAPDAYS = { "≤ 1 hari":1, "2–3 hari":2.5, "4–6 hari":5, "> 6 hari":7 };
function clarityOf(ths){
  let ok=0, tot=0; ["decision","success","blocker"].forEach(id=>{ const t=ths[id]; if(!t||!t.finalChecks) { tot+=4; return; } t.finalChecks.forEach(c=>{ tot++; if(c.ok) ok++; }); });
  return Math.round(ok/tot*100);
}
function readiness(a, clarity){
  const spo = {"Direksi / komisaris":90,"Kepala unit bisnis":72,"Tim HR sendiri":45,"Belum ada":25}[a.sponsor] ?? 40;
  const bud = {"Sudah masuk RKAP":90,"Sedang dibahas":70,"Bisa lewat revisi":45,"Belum ada rencana":22}[a.rkap] ?? 40;
  const cap = {"≤ 1 hari":30,"2–3 hari":55,"4–6 hari":80,"> 6 hari":92}[a.capacity] ?? 50;
  const clar = Math.max(30, Math.min(95, Math.round(clarity*0.9+8)));
  const lv = v => v>=75?["Kuat","hi"]:v>=55?["Cukup","mid"]:["Perlu diperkuat","lo"];
  const dims = [["Kejelasan arah",clar],["Dukungan sponsor",spo],["Kesiapan anggaran",bud],["Daya serap belajar",cap]].map(([k,v])=>({k,v,lv:lv(v)[0],c:lv(v)[1]}));
  const overall = Math.round(dims.reduce((s,d)=>s+d.v,0)/4);
  return { dims, overall, level: overall>=75?"Siap jalan":overall>=58?"Hampir siap":"Perlu persiapan", weakest:[...dims].sort((x,y)=>x.v-y.v)[0] };
}
function pickPrograms(a, diag, dec, capacity){
  const W = a.alloc, st = STORIES[a.story]||[], txt = (dec.answer||"")+" "+(dec.data.define||"");
  const boost = { behavior:["LDR-02"], manager:["LDR-02","LDR-01"], system:["LSS-01","EXE-01"], knowledge:["AI-101","COM-01"] }[diag]||[];
  const scored = CATALOG.map(p=>{ const u=W[p.area]||0; if(!u) return {...p,score:0};
    let s=u + (p.aud.includes(a.risk_group)?3:0) + (st.includes(p.area)?2:0) + (KWA[p.area].test(txt)?1.5:0) + (boost.includes(p.id)?5:0);
    if (p.id==="AI-TTT" && /l&d|mengajarkan/i.test(txt)) s+=5;
    return {...p,score:s}; }).filter(p=>p.score>0).sort((x,y)=>y.score-x.score);
  const ideal = scored.slice(0,6), idealDays = ideal.reduce((s,p)=>s+p.days,0);
  const avail = CAPDAYS[capacity]||2.5;
  const perPerson = d => Math.max(1, Math.round(d/2.2));   // satu peserta rata-rata ikut ±45% program
  let chosen=[]; for (const p of scored){ if (chosen.length>=5) break; const nd=chosen.reduce((s,x)=>s+x.days,0)+p.days; if (perPerson(nd)<=Math.max(avail,1.5) || chosen.length<2) chosen.push(p); }
  const must = { behavior:"LDR-02", manager:"LDR-02", system:"LSS-01" }[diag];
  if (must && !chosen.some(p=>p.id===must)){ const mp=CATALOG.find(p=>p.id===must); if(chosen.length>=3) chosen.pop(); chosen.splice(1,0,{...mp,score:99}); }
  return { chosen, idealDays:perPerson(idealDays), fitDays:perPerson(chosen.reduce((s,p)=>s+p.days,0)), avail };
}
function buildInsight(){
  const a = S.a, c = S.contact, dec = th("decision"), suc = th("success"), blk = th("blocker");
  const W = a.alloc, top = AK.filter(k=>W[k]>0).sort((x,y)=>W[y]-W[x]);
  const diagKey = blk.data.diag || "behavior", dg = DIAG[diagKey];
  const clarity = clarityOf(S.th), r = readiness(a, clarity);
  const pp = pickPrograms(a, diagKey, dec, a.capacity);
  const org = c.org || "Organisasi Anda";
  const probesUsed = S.probeCount;
  const heard = [
    `Agenda 2027: ${lowFirst(a.story||"")}.`,
    dec.answer ? `Yang belum siap, kata Anda: <q>${esc(trimDot(dec.answer))}</q>${dec.data.define?`, yang setelah diperjelas berarti <b>${esc(lowFirst(dec.data.define))}</b>`:""}.` : "",
    suc.data.metric ? `Bukti berhasil yang akan Anda pakai: <b>${esc(lowFirst(suc.data.metric))}</b>${suc.data.when?` mulai ${low(suc.data.when)}`:""}.` : (suc.answer && !isJunk(suc.answer) ? `Tanda berhasil: <q>${esc(trimDot(suc.answer))}</q>.` : ""),
    `Kelompok paling mahal bila gagal: ${lowFirst(a.risk_group||"-")}.`,
  ].filter(Boolean);
  const ins = [];
  const mx = W[top[0]]||0;
  if (mx>=5) ins.push({ t:`Fokus Anda tajam: ${mx*10}% perhatian ke ${low(top[0])}.`, p:`Itu bagus. Risikonya, area lain yang Anda beri poin kecil bisa menjadi hambatan diam-diam. Pastikan ${low(top[1]||top[0])} tidak ditinggalkan sama sekali.`, why:`Karena Anda memberi ${mx*10} dari 100 poin ke satu area.` });
  else if (mx<=3) ins.push({ t:"Perhatian Anda masih tersebar.", p:"Pembagian yang rata biasanya tanda prioritas belum diputuskan di level direksi. Program yang dibagi tipis jarang terasa dampaknya.", why:`Karena poin terbesar Anda hanya ${mx*10} dari 100.` });
  else ins.push({ t:`Dua prioritas: ${low(top[0])} dan ${low(top[1]||"")}.`, p:"Komposisi yang sehat. Urutkan: mana yang harus jalan lebih dulu supaya yang kedua lebih mudah?", why:`Karena ${W[top[0]]*10} dan ${(W[top[1]]||0)*10} poin Anda ada di dua area ini.` });
  if (dec.data.now){ const g=dec.data.target-dec.data.now;
    ins.push({ t:`Target naik ${g} poin, dengan ${low(a.capacity||"-")} belajar per orang.`, p: g>=4 && pp.avail<=2.5 ? "Lompatan sebesar itu tidak akan tercapai lewat kelas saja. Sebagian besar perubahan harus terjadi di pekerjaan: tugas nyata, coaching, dan review berkala." : "Targetnya masuk akal untuk waktu belajar yang tersedia, asalkan ada praktik di antara sesi.", why:`Karena Anda menilai posisi sekarang ${dec.data.now}/10 dan target ${dec.data.target}/10.` }); }
  ins.push({ t:`Kebutuhan Anda pada dasarnya soal ${dg.k.toLowerCase()}.`, p:dg.why, why: blk.data.diag ? `Karena Anda menjawab bahwa program sebelumnya berhenti di titik ini.` : "Asumsi Iris, karena penyebabnya belum dipastikan." });
  const early = (a.timing==="Kuartal 1"||a.timing==="Kuartal 2"), noBudget = (a.rkap==="Bisa lewat revisi"||a.rkap==="Belum ada rencana");
  if (early && noBudget) ins.splice(1,0,{ t:"Waktu Anda lebih cepat dari anggaran Anda.", p:`Anda ingin hasil di ${low(a.timing)}, tapi kebutuhan ini belum masuk RKAP. Tanpa ditangani, program baru bisa jalan paling cepat di semester 2.`, why:`Karena Anda memilih “${a.timing}” dan “${a.rkap}”.` });
  const acts = [];
  acts.push([`Catat angka awal minggu ini`, `Ukur ${suc.data.metric?lowFirst(suc.data.metric):INDICATOR[top[0]]} sebelum apa pun dimulai. Tanpa angka awal, hasil tidak bisa dibuktikan.`]);
  if (diagKey==="manager"||diagKey==="behavior") acts.push([`Sepakati check-in 15 menit tiap dua minggu`, `${blk.data.owner&&!/belum/i.test(blk.data.owner)?blk.data.owner:"Atasan langsung"} menanyakan satu hal: apa yang sudah dipraktikkan, dan apa yang menghambat.`]);
  if (diagKey==="system") acts.push([`Pilih satu proses untuk diubah bersama`, "Jangan latih orang untuk cara kerja yang tidak berubah. Pilih satu proses, lalu ubah bersama peserta."]);
  if (diagKey==="knowledge") acts.push([`Siapkan satu halaman rujukan`, "Buat ringkasan satu halaman yang bisa dibuka peserta saat bekerja, bukan modul tebal."]);
  if (noBudget) acts.push([`Ajukan lewat revisi RKAP`, "Lampirkan halaman ini sebagai dasar usulan. Sebutkan angka awal dan target yang akan dipantau."]);

/* ---------- GRAFIK (SVG, dari jawaban) ---------- */
function donut(W){
  const tot=sum(W)||1, R=52, C=2*Math.PI*R; let off=0;
  const segs = AK.filter(k=>W[k]).map(k=>{ const len=W[k]/tot*C; const s=`<circle r="${R}" cx="70" cy="70" fill="none" stroke="${ACOL[k]}" stroke-width="20" stroke-dasharray="${len-2} ${C-len+2}" stroke-dashoffset="${-off}" transform="rotate(-90 70 70)"/>`; off+=len; return s; }).join("");
  const mx = AK.reduce((m,x)=>W[x]>W[m]?x:m,AK[0]);
  return `<svg viewBox="0 0 140 140" width="140" height="140" style="align-self:center">${segs}<text x="70" y="66" text-anchor="middle" font-size="22" font-weight="800" fill="#3A138A">${W[mx]*10}%</text><text x="70" y="84" text-anchor="middle" font-size="9.5" fill="#6B6380">area terbesar</text></svg>`;
}
function radar(dims){
  const cx=90, cy=82, R=58, pts=dims.map((d,i)=>{ const ang=-Math.PI/2+i*Math.PI/2, rr=R*d.v/100; return [cx+rr*Math.cos(ang), cy+rr*Math.sin(ang)]; });
  const ax=dims.map((d,i)=>{ const ang=-Math.PI/2+i*Math.PI/2; return [cx+R*Math.cos(ang), cy+R*Math.sin(ang)]; });
  const lab=[["Arah",cx,cy-R-8,"middle"],["Sponsor",cx+R+6,cy+4,"start"],["Anggaran",cx,cy+R+15,"middle"],["Daya serap",cx-R-6,cy+4,"end"]];
  const grid=[.33,.66,1].map(f=>`<polygon points="${ax.map(([x,y])=>`${cx+(x-cx)*f},${cy+(y-cy)*f}`).join(" ")}" fill="none" stroke="#E7E2F0"/>`).join("");
  return `<svg viewBox="0 0 180 170" width="100%" style="max-height:170px">${grid}${ax.map(([x,y])=>`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#E7E2F0"/>`).join("")}
    <polygon points="${pts.map(p=>p.join(",")).join(" ")}" fill="rgba(138,34,159,.22)" stroke="#8A229F" stroke-width="2"/>
    ${pts.map(([x,y],i)=>`<circle cx="${x}" cy="${y}" r="3.5" fill="${dims[i].c==='hi'?'#1F8A5B':dims[i].c==='mid'?'#F6AA3C':'#C8191B'}"/>`).join("")}
    ${lab.map(([t,x,y,an],i)=>`<text x="${x}" y="${y}" text-anchor="${an}" font-size="9.5" font-weight="700" fill="#6B6380">${t} ${dims[i].v}</text>`).join("")}</svg>`;
}
function gapChart(g){
  const pos = v => ((v-1)/9*100).toFixed(1)+"%";
  return `<div class="gaptrack"><div class="ln"></div><div class="fill" style="left:${pos(Math.min(g.now,g.target))};width:${(Math.abs(g.target-g.now)/9*100).toFixed(1)}%"></div>
    <span class="lb" style="left:${pos(g.now)}">Sekarang</span><span class="lb" style="left:${pos(g.target)}">Akhir 2027</span>
    <div class="dot" style="left:${pos(g.now)};background:#8A229F">${g.now}</div><div class="dot" style="left:${pos(g.target)};background:#F6AA3C;color:#2A0C66">${g.target}</div>
    <span class="ax" style="left:0">1</span><span class="ax" style="right:0">10</span></div>`;
}
function loadChart(pp){
  const mx = Math.max(pp.idealDays, pp.avail, pp.fitDays, 1);
  const bar=(lab,v,col)=>`<div class="r"><small><span>${lab}</span><span>${v} hari</span></small><div class="t"><i style="width:${v/mx*100}%;background:${col}"></i></div></div>`;
  return `<div class="loadbars">${bar("Kalau semua kebutuhan diikuti",pp.idealDays,"#C8191B")}${bar("Yang tersedia per orang",pp.avail,"#3A138A")}${bar("Roadmap yang disarankan",pp.fitDays,"#1F8A5B")}</div>`;
}

    [D]:`<g stroke="#fff" stroke-width="2.5" opacity=".7"><line x1="50" y1="60" x2="100" y2="90"/><line x1="100" y1="90" x2="150" y2="55"/><line x1="100" y1="90" x2="140" y2="118"/><line x1="150" y1="55" x2="190" y2="88"/></g><g fill="#fff"><circle cx="50" cy="60" r="8"/><circle cx="100" cy="90" r="11"/><circle cx="150" cy="55" r="8"/><circle cx="140" cy="118" r="7"/><circle cx="190" cy="88" r="9" fill="#F6AA3C"/></g>`,

  }[p.area];
  const pet = PET.map((c,i)=>`<g transform="rotate(${i*45})"><path d="M-4.6 -17 L4.6 -17 L8.6 -43 L-8.6 -43 Z" fill="#fff" opacity="${.1+.05*(i%3)}"/></g>`).join("");
  return `<svg viewBox="0 0 320 140" aria-hidden="true"><defs><linearGradient id="g${p.id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${col}"/><stop offset="1" stop-color="${dark}"/></linearGradient></defs>
    <rect width="320" height="140" fill="url(#g${p.id})"/><g transform="translate(270 112) scale(1.7)">${pet}</g>${motif}
    <text x="16" y="24" font-size="10.5" font-weight="800" fill="#fff" opacity=".85" letter-spacing="1.2">${esc(p.area.toUpperCase())}</text></svg>`;
}

const leadTop = l => AK.reduce((m,x)=>(l.alloc[x]||0)>(l.alloc[m]||0)?x:m,AK[0]);
function vAdmin(){
  const leads = (S.mine?[S.mine]:[]).concat(SEED);
  leads.forEach(l=>{ if(l.overall==null) l.overall = readiness(l, l.clarity).overall; });
  const U = {h:"Tinggi",m:"Sedang",l:"Rendah"};
  const avg = AK.map((k,i)=>({k,v:Math.round(leads.reduce((s,l)=>s+(l.alloc[k]||0),0)/leads.length*10)}));
  const ideas = leads.flatMap(l=>l.ideas||[]);
  const askedN = leads.filter(l=>(l.asked||[]).length).length;
  const dcount = Object.keys(DIAG).map(k=>({k,n:leads.filter(l=>l.diag===k).length}));
  app.innerHTML = `
  <div class="adm"><div class="wrap">
    <h1>Dashboard IIRC <span class="demo-note">DATA CONTOH</span></h1>
    <p class="sub">Siapa yang mengisi, apa kebutuhannya, seberapa jelas, dan program apa yang mereka tanyakan.</p>
    <div class="kpis">
      <div class="kpi"><small>Insight terkirim</small><b>${leads.length+41}</b><span>+${leads.length} minggu ini</span></div>
      <div class="kpi"><small>Rata-rata kejelasan jawaban</small><b>${Math.round(leads.reduce((s,l)=>s+l.clarity,0)/leads.length)}%</b><span>setelah penggalian Iris</span></div>
      <div class="kpi"><small>Menanyakan program</small><b>${askedN}</b><span>siap dihubungi</span></div>
      <div class="kpi"><small>Ide program baru</small><b>${ideas.length}</b><span>di luar katalog</span></div>
    </div>
    <div class="grid2">
      <div class="panel"><h3>Lead terbaru <small>klik untuk briefing Iris</small></h3>
        <div style="overflow:auto"><table>
          <thead><tr><th>Organisasi</th><th>Diagnosis</th><th>Kejelasan</th><th>Kesiapan</th><th>Urgensi</th><th>Status</th></tr></thead>
          <tbody>${leads.map((l,i)=>{const u=urgency(l);return `<tr class="row ${l.isNew?'new':''}" onclick="openLead(${i})">
            <td><b>${esc(l.org)}</b><span class="s">${esc(leadTop(l))}</span></td>
            <td><span class="s" style="color:var(--ink);font-weight:600">${esc(DIAG[l.diag]?.k||"-")}</span></td>
            <td><div class="rbar"><div class="t"><i style="width:${l.clarity}%;background:var(--purple)"></i></div><b>${l.clarity}%</b></div></td>
            <td><div class="rbar"><div class="t"><i class="bg-${l.overall>=75?'hi':l.overall>=58?'mid':'lo'}" style="width:${l.overall}%"></i></div><b>${l.overall}</b></div></td>
            <td><span class="urg ${u}"><i></i>${U[u]}</span></td>
            <td><span class="st ${l.isNew?'newb':''}">${esc(l.status)}</span></td></tr>`}).join("")}</tbody>
        </table></div>
      </div>
      <div style="display:flex;flex-direction:column;gap:16px">
        <div class="panel"><h3>Jenis kebutuhan <small>hasil diagnosis Iris</small></h3>
          <div class="bars">${dcount.map((c,i)=>`<div class="r"><span>${DIAG[c.k].k}</span><div class="t"><i style="width:${c.n/Math.max(...dcount.map(x=>x.n),1)*100}%;background:${["#F6AA3C","#8A229F","#C8191B","#3A138A"][i]}"></i></div><span class="v">${c.n}</span></div>`).join("")}</div></div>
        <div class="panel"><h3>Ke mana perhatian L&D mengalir <small>rata-rata dari 100 poin</small></h3>
          <div class="bars">${avg.map(c=>`<div class="r"><span>${esc(c.k)}</span><div class="t"><i style="width:${c.v/Math.max(...avg.map(x=>x.v),1)*100}%;background:${ACOL[c.k]}"></i></div><span class="v">${c.v}</span></div>`).join("")}</div></div>
        <div class="panel"><h3>Ide program baru <small>dari klien</small></h3><div class="um">${ideas.slice(0,4).map(g=>`<div><b>${esc(g)}</b><span>1</span></div>`).join("") || '<p class="sub">Belum ada.</p>'}</div></div>
      </div>
    </div>
  </div></div>
  ${S.openLead!==null?drawer(leads[S.openLead]):""}`;
}
function openLead(i){ S.openLead=i; vAdmin(); }
function closeLead(){ S.openLead=null; vAdmin(); }
function firstName(pic){ return (pic.split("·")[0]||"").trim().replace(/^(Ibu|Bu|Bapak|Pak)\s+/i,"").split(" ")[0]; }
function drawer(l){
  const u = urgency(l), U={h:"Tinggi",m:"Sedang",l:"Rendah"}, r = readiness(l, l.clarity), dg = DIAG[l.diag]||DIAG.behavior;
  const openQ = l.asked.length ? `Dari program yang Anda tandai, ${l.asked[0]}, kelompok mana yang mau dimulai lebih dulu?` : { "Kesiapan anggaran":"Kapan batas pengajuan revisi RKAP, dan siapa yang memutuskan?", "Dukungan sponsor":"Siapa di level direksi yang paling berkepentingan dengan hasil ini?", "Daya serap belajar":"Berapa hari belajar yang benar-benar dilindungi oleh atasan langsung?", "Kejelasan arah":"Kalau program ini berhasil, angka apa di laporan direksi yang berubah?" }[r.weakest.k];
  const wa = `Selamat siang, ${firstName(l.pic)}. Terima kasih sudah menyusun Learning Insight 2027 bersama Iris.\n\nDari jawaban Anda, kebutuhannya lebih banyak soal ${dg.k.toLowerCase()}, bukan sekadar menambah kelas.${l.asked.length?` Kami sudah menyiapkan gambaran ${l.asked[0]} untuk konteks Anda.`:""}\n\nBoleh kami jadwalkan 30 menit minggu ini untuk membahasnya?\n\nSalam, Tim IIRC`;
  return `<div class="drawer-bg" onclick="closeLead()"></div>
  <aside class="drawer">
    <div class="dh"><button class="x" onclick="closeLead()">×</button><div class="row">${irisAv(46,"idle")}<div><small>Briefing Iris</small><h2>${esc(l.org)}</h2><p>${esc(l.pic)}</p></div></div></div>
    <div class="db">
      <h4>Hasil penggalian Iris · kejelasan ${l.clarity}%</h4>
      <div class="brief"><ul style="padding-left:16px">${l.digest.map(d=>`<li>${d}</li>`).join("")}</ul></div>
      ${l.flags.length?`<h4>Asumsi yang perlu dicek saat bicara</h4><ul>${l.flags.map(f=>`<li>${esc(f)}</li>`).join("")}</ul>`:""}
      <h4>Diagnosis</h4><div class="brief"><b>${esc(dg.k)}</b> · ${esc(dg.fmt)}</div>
      <h4>Profil kesiapan · ${r.overall} (${r.level})</h4>
      <div class="dm">${r.dims.map(d=>`<div class="m"><small>${d.k}</small><b class="lv-${d.c}">${d.v}</b> <span class="lv-${d.c}" style="font-size:12px;font-weight:700">${d.lv}</span></div>`).join("")}</div>
      <h4>Program yang ditanyakan</h4>${l.asked.length?`<ul>${l.asked.map(a=>`<li><b>${esc(a)}</b></li>`).join("")}</ul>`:`<p class="sub">Belum ada. Insight sudah dikirim ke email.</p>`}
      ${l.ideas.length?`<h4>Ide program di luar katalog</h4><div class="brief">${l.ideas.map(esc).join("<br>")}</div>`:""}
      <div class="kv" style="margin-top:16px"><span>Urgensi</span><b class="urg ${u}"><i></i>${U[u]}</b><span>Hasil pertama</span><b>${esc(l.timing||"-")}</b><span>RKAP</span><b>${esc(l.rkap||"-")}</b><span>Sponsor</span><b>${esc(l.sponsor||"-")}</b></div>
      <h4>Pertanyaan pembuka yang disarankan</h4><div class="brief"><q>${esc(openQ)}</q></div>
      <h4>Pesan WhatsApp siap kirim</h4><div class="wa" id="waTxt">${esc(wa)}</div>
      <div class="wa-b"><button class="btn pri" id="copyWA" onclick="copyWA()">Salin pesan</button></div>
    </div>
  </aside>`;
}
async function copyWA(){ const t=document.getElementById("waTxt").textContent; let ok=false; try{ await navigator.clipboard.writeText(t); ok=true; }catch(e){} toast(ok?"Pesan disalin. Tempel di WhatsApp.":"Blok teks pesan di atas, lalu salin manual."); }

/* ---------- INIT ---------- */
document.addEventListener("keydown", e=>{
  if (S.view==="quiz" && e.key==="Enter" && !e.shiftKey && e.target.tagName!=="TEXTAREA"){ const q=QUESTIONS[S.qi]; if(q.type!=="open"){ e.preventDefault(); next(); } }
  if (e.key==="Escape" && S.openLead!==null) closeLead();
});
if (location.hash==="#admin") go("admin"); else go("landing");
window.addEventListener("hashchange", ()=>{ if(location.hash==="#admin" && S.view!=="admin") go("admin"); });

</script>
</body>
